name: Build Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: user-service
            context: ./1-users
            target: ""
          - name: wallet-service
            context: ./3-wallet
            target: ""
          - name: transaction-service
            context: ./4-transactions
            target: ""
          - name: fraud-detection-service
            context: ./5-fraud-detection
            target: ""
          - name: notification-service
            context: ./2-notification
            target: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          tag="${{ matrix.name }}:ci"
          context="${{ matrix.context }}"
          target="${{ matrix.target }}"
          if [ -n "$target" ]; then
            docker build -t "$tag" --target "$target" "$context"
          else
            docker build -t "$tag" "$context"
          fi
