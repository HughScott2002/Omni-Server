# Local hooks that reuse the tools from the Nix dev shell — no extra
# downloads, same versions as the shell's golangci-lint/ruff. Installed
# automatically by the flake's shellHook; run manually with
# `pre-commit run --all-files`.
repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
